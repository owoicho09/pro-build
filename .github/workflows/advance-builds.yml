name: Advance pending builds

# Vercel's own Cron Jobs are capped at once/day on our current (Hobby)
# plan, which is too infrequent for /api/cron/advance-builds — that route
# is the durable fallback that keeps a build moving (and its preview/
# thumbnail/credit accounting finalized) even when nobody has the
# workspace tab open. This workflow is the actual, frequent backstop until
# we're on a Vercel plan tier with sub-daily Cron Jobs, at which point this
# can be replaced by a `crons` entry in vercel.json instead.
#
# Requires two repo secrets (Settings -> Secrets and variables -> Actions):
#   APP_BASE_URL - the deployed app's origin, e.g. https://probuild.example.com
#   CRON_SECRET  - must match the CRON_SECRET env var configured on the
#                  deployment; the route rejects any other value with 401.
on:
  schedule:
    - cron: "* * * * *"
  workflow_dispatch: {}

jobs:
  advance-builds:
    runs-on: ubuntu-latest
    steps:
      - name: Call advance-builds endpoint
        run: |
          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.APP_BASE_URL }}/api/cron/advance-builds"
